    <!-- Часть 1: Таблица -->
    <h2 id="table-heading">Student Academic Performance Log</h2>
    <table>
        <tr>
            <th>Student's name</th>
            <th>Item</th>
            <th>Grade</th>
        </tr>
        <tr>
            <td>Bekhsultan</td>

        <tr class="highlight-row">
            <td>Yerasyl</td>

    <!-- Часть 2: Форма -->
    <div id="feedback-container">
        <h2 class="form-title">Contact form</h2>
        <form>
            <label for="fname">Name:</label>
            <input type="text" id="fname" name="fname" placeholder="Enter your name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@astanait.edu.kz">

            <label for="role">Your role:</label>
            <select id="role" name="role">
                <option value="student">Student</option>
                <option value="teacher">Professor</option>
                <option value="other">Other</option>
            </select>

            <label>Do you like this course?</label>
            <div class="radio-group">
                <input type="radio" id="yes" name="like_course" value="yes">
                <label for="yes" style="display:inline; font-weight:normal;">Yes</label>
                
                <input type="radio" id="no" name="like_course" value="no">
                <label for="no" style="display:inline; font-weight:normal;">You bet!</label>
            </div>

            <label for="comment">Comment:</label>
            <textarea id="comment" name="comment" rows="4" placeholder="Tap you review..."></textarea>

            <button type="submit" class="submit-btn">Send!</button>
        </form>
    </div>
